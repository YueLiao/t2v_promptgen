{% extends "base.html" %}
{% block title %}生成中 ｜ {{ run.id }}{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center">
  <div class="inline-block animate-spin h-12 w-12 border-4 border-orange-500 border-t-transparent rounded-full mb-6"></div>
  <h2 class="text-xl font-bold text-slate-900 mb-2">正在生成 {{ run.target_set_size }} 条测试用例</h2>
  <p class="text-sm text-slate-500">基于 {{ run.sl2_list|length }} 个检查项 × {{ run.axes|length }} 个测试变量</p>
  <p class="text-xs text-slate-400 mt-4">马上跳到审核页…</p>
  <meta http-equiv="refresh" content="1; url=/runs/{{ run.id }}">
</div>
{% endblock %}
